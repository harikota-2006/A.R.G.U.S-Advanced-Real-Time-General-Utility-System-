<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGUS Study</title>
<style>
:root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#000;color:#e5e7eb}*{box-sizing:border-box}body{margin:0}canvas#argus-canvas{position:fixed;inset:0;z-index:-1}header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #555}main{max-width:850px;margin:8vh auto;padding:24px;background:#000b;border:1px solid #555}button,input{font:inherit;padding:12px;background:#111;color:inherit;border:1px solid #777;border-radius:4px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid white}form{display:flex;gap:8px;margin-top:16px}input[type=text]{flex:1;min-width:0}#reply{white-space:pre-wrap;line-height:1.65;max-height:42vh;overflow:auto}#visual{position:fixed;right:3vw;top:22vh;width:40vw;background:#0009;padding:20px;border:1px solid #777}svg{width:100%;max-height:38vh}#downloads a{display:block;color:white;margin:10px}#questions{max-height:150px;overflow:auto}small{display:block;color:#bbb;margin-top:12px}@media(max-width:700px){#visual{width:85vw}main{margin:30px 12px}}[hidden]{display:none!important}
</style></head><body><canvas id="argus-canvas"></canvas><header><strong>A.R.G.U.S.</strong><span id="mode">STUDY PARTNER</span></header>
<main><button id="start">Start a study session</button> <button id="mic" disabled>Enable microphone</button>
<label><input type="file" id="upload" accept=".pdf,.pptx,.docx,.txt,.md" disabled> Study material</label><p id="status" role="status">Your session lasts 24 hours. Keep this browser session to return to your work.</p>
<div id="reply" aria-live="polite"></div><div id="downloads"></div>
<form id="form"><input id="text" type="text" aria-label="Ask ARGUS" placeholder="Ask about your material or request a document" maxlength="8000"><button>Send</button><button type="button" id="stop">Stop</button></form><button id="save-question">Save this question</button><ul id="questions"></ul>
<small>Research answers cite retrieved evidence. Reports ask for approval before publishing a download.</small></main>
<section id="visual" hidden><button id="close">Close chart</button><p id="coverage"></p><svg viewBox="0 0 250 250" role="group" aria-label="Study progress"></svg><p id="topics"></p></section>
<div id="notice" role="status"></div><div id="bar-audio" hidden></div>
<script src="/assets/three.min.js"></script><script src="/assets/visualizer.js"></script><script src="/client.js"></script></body></html>
